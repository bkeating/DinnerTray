name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          [xml]$project = Get-Content DinnerTray.csproj
          $expected = 'v' + [string]$project.Project.PropertyGroup.Version
          if ($env:GITHUB_REF_NAME -ne $expected) { throw "Tag must match project version: $expected" }
      - name: Test
        run: ./test.ps1
      - name: Package standalone executable
        run: ./package.ps1
      - name: Check repository cleanliness
        run: |
          $trackedOutputs = git ls-files --cached --ignored --exclude-from=.gitignore
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect tracked files.' }
          if ($trackedOutputs) { throw "Tracked files match .gitignore: $trackedOutputs" }
          $changes = git status --porcelain --untracked-files=all
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect the working tree.' }
          if ($changes) { throw "Testing or packaging left changes: $changes" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DinnerTray-windows-x64
          path: |
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Save rendered test preview
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-preview
          path: test-results/*.png
          if-no-files-found: ignore
          retention-days: 7

  draft-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: DinnerTray-windows-x64
          path: release
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A release may already have been published with verified local artifacts.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" release/*.zip release/*.sha256 \
            --verify-tag --draft --title "DinnerTray $GITHUB_REF_NAME" \
            --notes "Experimental Windows 11 x64 build. Extract DinnerTray.exe and run it; .NET is included. Chrome or Edge is required for video. Builds are unsigned. Review CHANGELOG.md and complete manual desktop smoke tests before publishing this draft."
